<ion-content class="login-content">
  <!-- Hero Section -->
  <div class="hero-section">
    <div class="hero-decor" aria-hidden="true">
      <span class="circle circle-left"></span>
      <span class="circle circle-right"></span>
      <span class="circle circle-small"></span>
    </div>
    <div class="logo-container">
      <div class="logo-box">🍔</div>
    </div>
    <h1 class="app-title">Food <span class="highlight">4U</span></h1>
    <p class="tagline">Delicious food, delivered fast</p>
  </div>

  <!-- Form Section -->
  <ion-card class="form-card">
    <!-- Tabs -->
    <div class="tabs">
      <button type="button" class="tab" [class.active]="!isSignUp" (click)="goToSignIn()">Sign In</button>
      <button type="button" class="tab" [class.active]="isSignUp" (click)="goToSignUp()">Sign Up</button>
    </div>

    <div class="auth-form-panel">
      <form *ngIf="!isSignUp" class="login-form">
        <div class="form-group">
          <label>Email</label>
          <ion-input type="email" placeholder="you@email.com" class="form-input"></ion-input>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="password-wrapper">
            <ion-input type="password" placeholder="Min. 6 characters" class="form-input"></ion-input>
            <button type="button" class="show-password">Show</button>
          </div>
        </div>

        <div class="forgot-password">
          <a href="#">Forgot password?</a>
        </div>

        <ion-button type="button" expand="block" class="sign-in-btn" (click)="goToHome()">
          Sign In →
        </ion-button>
      </form>

      <form *ngIf="isSignUp" class="signup-form">
        <div class="form-group">
          <label>Full Name</label>
          <ion-input type="text" placeholder="Your name" class="form-input"></ion-input>
        </div>

        <div class="form-group">
          <label>Email</label>
          <ion-input type="email" placeholder="you@email.com" class="form-input"></ion-input>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="password-wrapper">
            <ion-input type="password" placeholder="Min. 6 characters" class="form-input"></ion-input>
            <button type="button" class="show-password">Show</button>
          </div>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <ion-input type="password" placeholder="Re-enter your password" class="form-input"></ion-input>
        </div>

        <ion-button type="button" expand="block" class="sign-in-btn" (click)="goToGetStarted()">
          Create account →
        </ion-button>
      </form>
    </div>

    <div class="divider-text">or continue with</div>

    <div class="social-buttons">
      <button class="social-btn" type="button">
        <span class="icon">🔵</span> Google
      </button>
      <button class="social-btn" type="button">
        <span class="icon">🍎</span> Facebook
      </button>
    </div>

    <div class="footer-text">
      <p *ngIf="!isSignUp">By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></p>
      <p *ngIf="isSignUp">Already have an account? <a href="#" (click)="goToSignIn(); $event.preventDefault()">Sign In</a></p>
    </div>
  </ion-card>
</ion-content>
