<ion-content class="signup-content">
  <div class="hero-section">
    <div class="logo-container">
      <div class="logo-box">🍔</div>
    </div>
    <h1 class="app-title">Create your <span class="highlight">Food 4U</span> account</h1>
    <p class="tagline">Sign up to order your favorite meals.</p>
  </div>

  <ion-card class="form-card">
    <div class="tabs">
      <button type="button" class="tab" (click)="goToLogin()">Sign In</button>
      <button type="button" class="tab active">Sign Up</button>
    </div>

    <form class="signup-form">
      <div class="form-group">
        <label>Full Name</label>
        <ion-input type="text" placeholder="Your name" class="form-input"></ion-input>
      </div>

      <div class="form-group">
        <label>Email</label>
        <ion-input type="email" placeholder="you@email.com" class="form-input"></ion-input>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-wrapper">
          <ion-input type="password" placeholder="Min. 6 characters" class="form-input"></ion-input>
          <button type="button" class="show-password">Show</button>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <ion-input type="password" placeholder="Re-enter your password" class="form-input"></ion-input>
      </div>

      <ion-button type="submit" expand="block" class="sign-up-btn">
        Create Account →
      </ion-button>
    </form>

    <div class="footer-text">
      <p>Already have an account? <a href="javascript:void(0)" (click)="goToLogin()">Sign In</a></p>
    </div>
  </ion-card>
</ion-content>
