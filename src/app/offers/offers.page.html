<ion-content class="page-content">
  <div class="page-shell">
    <header class="topbar">
      <button type="button" class="back-btn" aria-label="Back" (click)="goHome()"><</button>
      <span class="page-text">Offers</span>
    </header>

    <div class="offers-list">
      <section class="offer-section" *ngFor="let offer of offerGroups">
        <article class="offer-card" [ngClass]="offer.accentClass">
          <div class="offer-tag">{{ offer.label }}</div>
          <h2>{{ offer.title }}</h2>
          <p>{{ offer.subtitle }}</p>
          <small>{{ offer.description }}</small>
        </article>

        <div class="meal-row" aria-label="Applicable meals">
          <button type="button" class="meal-pill" *ngFor="let meal of offer.meals" (click)="openMeal(meal)">
            <img class="meal-pill-image" [src]="meal.image" [alt]="meal.name" />
            <span class="meal-pill-copy">
              <strong>{{ meal.name }}</strong>
              <small>{{ meal.restaurantName }} · {{ meal.price }}</small>
            </span>
          </button>
        </div>
      </section>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button
      type="button"
      class="nav-item"
      *ngFor="let item of navigation"
      [class.active]="isTabActive(item.label)"
      (click)="navigateTo(item.route)"
    >
      <img class="nav-icon" [src]="item.iconImage" [alt]="item.label + ' navigation icon'" />
      <span>{{ item.label }}</span>
    </button>
  </nav>
</ion-content>
